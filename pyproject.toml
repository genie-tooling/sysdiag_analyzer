[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sysdiag-analyzer"
version = "0.14.0"
authors = [
  { name="Kal Aeolian", email="kal@datacrunch.io" },
]
description = "Systemd & System Health Diagnostic Tool with ML, LLM, eBPF & Child Process Analysis" # Updated description
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT License" } # Specify license correctly
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Development Status :: 4 - Beta",
]
dependencies = [
    # Core runtime only. Everything heavyweight or needing a compiler
    # (native systemd/dbus bindings, ML stack, prometheus, graph) lives in the
    # optional-dependency groups below and is gated by HAS_* import guards, so a
    # base install stays small and pure-Python with subprocess fallbacks.
    "typer>=0.9.0,<1.0.0",
    "rich>=13.0.0,<14.0.0",
    "psutil>=5.9.0",
    "pygments>=2.19.2",
    # TOML config parsing uses the stdlib `tomllib` (Python >= 3.11).
]

[project.scripts]
sysdiag-analyzer = "sysdiag_analyzer.main:app"

[project.urls]
"Homepage" = "https://github.com/genie-tooling/sysdiag_analyzer"
"Bug Tracker" = "https://github.com/genie-tooling/sysdiag_analyzer/issues"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "needs_dbus: mark test as requiring optional dbus-python package",
    "needs_cysystemd: mark test as requiring optional cysystemd package",
    "needs_networkx: mark test as requiring optional networkx package",
    "needs_ml: mark test as requiring optional ml dependencies (pandas, sklearn, lightgbm, joblib)",
    "needs_llm: mark test as requiring optional llm dependencies (ollama, tomli)",
    "needs_ebpf: mark test as requiring optional bcc package and root privileges", # Added eBPF marker
]
filterwarnings = [
    "ignore:.*__array__ implementation.*:DeprecationWarning",
]


[tool.ruff]
line-length = 130
# select = ["E", "W", "F", "I", "UP"] # Example selection - Keep commented out unless user wants linting config

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    # Include optional runtime deps for testing if needed
    "cysystemd>=1.0.0; platform_system=='Linux'",
    "dbus-python>=1.2.16,<2.0.0; platform_system=='Linux'",
    "networkx>=3.0,<4.0",
    # Include ML deps in dev for comprehensive testing
    "pandas>=1.5.0,<3.0.0",
    "scikit-learn>=1.1.0,<2.0.0",
    "tensorflow>=2.12.0",
    "joblib>=1.1.0,<2.0.0",
    # Include LLM deps in dev
    "ollama>=0.1.0,<0.2.0",
    "openai>=1.0.0,<2.0.0",
    # eBPF bindings (python3-bpfcc / python3-bcc) come from the distro, not PyPI
    # (see the [ebpf] extra). CI installs them via apt; eBPF tests skip if absent.
    "prometheus-client>=0.21.1",
]
# Keep explicit groups for clarity if desired
native = [
    "cysystemd>=1.0.0; platform_system=='Linux'",
    "dbus-python>=1.2.16,<2.0.0; platform_system=='Linux'",
]
full-graph = [
    "networkx>=3.0,<4.0",
]
ml = [ # ML features group
    "pandas>=1.5.0,<3.0.0",
    "scikit-learn>=1.1.0,<2.0.0",
    "tensorflow>=2.12.0", # Added for LSTM Autoencoder
    "joblib>=1.1.0,<2.0.0", # For model persistence
]
llm = [ # New group for LLM features
    "ollama>=0.1.0,<0.2.0", # Ollama client
]
openai = [ # OpenAI-compatible backends (OpenAI, vLLM, llama.cpp, LocalAI, ...)
    "openai>=1.0.0,<2.0.0",
]
ebpf = [
    # BCC's Python bindings are NOT on PyPI (the PyPI "bcc" project is an
    # unrelated package). Install them from your distro instead:
    #   Debian/Ubuntu: sudo apt install python3-bpfcc bpfcc-tools libbpfcc-dev
    #   Fedora/RHEL:   sudo dnf install python3-bcc bcc bcc-devel
    # plus matching kernel headers, and use a venv created with
    # --system-site-packages so the `bcc` module is importable.
    # This group is intentionally empty; it documents the feature + its deps.
]
exporter = [
    "prometheus-client>=0.21.1",
]
